<text x="35" y="969" fill="#7aa2f7" font-size="19">OPERATING FLOW</text>
<text x="35" y="1004" fill="#c0caf5" font-size="17">1. Apply DC → bias and logic rails start; GDT power is direct; gate drivers require valid bias.</text>
<text x="35" y="1037" fill="#c0caf5" font-size="17">2. Configure ADC and FPGA; qualify samples and phase edges; precharge bootstrap supplies.</text>
<text x="35" y="1070" fill="#c0caf5" font-size="17">3. FPGA measures CT phase/amplitude and schedules drive; ADC overcurrent requests a current-zero burst ending.</text>
<text x="35" y="1113" fill="#f7768e" font-size="16">Schematic implemented; routing and actual GDT/load qualification are pending.</text>
<text x="35" y="1145" fill="#565f89" font-size="15">GDT secondary destinations/polarities and per-device gate networks still require confirmation.</text>
